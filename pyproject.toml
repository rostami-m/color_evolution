[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "color-empirical-theory"
version = "0.1.0"
description = "Code for 'Color perception as an evolved strategy'"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
    "h5py>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]

[project.optional-dependencies]
dev = ["pytest"]
